<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation Checker – Evergreen Goodwill</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --eg-green:       #00653a;
    --eg-green-dark:  #004d2b;
    --eg-green-light: #e6f2ec;
    --eg-green-mid:   #c2ddd0;
    --eg-accent:      #f5a623;
    --eg-red:         #c0392b;
    --eg-red-light:   #fdf0ee;
    --eg-blue:        #1a5fa8;
    --eg-blue-light:  #eaf1fb;
    --eg-text:        #1a1a1a;
    --eg-muted:       #5a6672;
    --eg-border:      #d4dde4;
    --eg-white:       #ffffff;
    --eg-bg:          #f7faf8;
    --radius:         10px;
    --shadow:         0 2px 12px rgba(0,101,58,.10);
  }
  #egnw-checker {
    font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif;
    color: var(--eg-text);
    background: var(--eg-bg);
    border: 1.5px solid var(--eg-green-mid);
    border-radius: 16px;
    padding: 32px 28px 36px;
    max-width: 680px;
    margin: 0 auto;
  }
  .egnw-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 26px; }
  .egnw-icon { flex-shrink: 0; width: 48px; height: 48px; background: var(--eg-green); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .egnw-icon svg { width: 26px; height: 26px; }
  .egnw-title { font-size: 22px; font-weight: 700; color: var(--eg-green-dark); line-height: 1.2; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .egnw-subtitle { font-size: 14px; color: var(--eg-muted); margin-top: 4px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .egnw-search-wrap { position: relative; margin-bottom: 10px; }
  .egnw-search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--eg-muted); fill: none; pointer-events: none; }
  #egnw-input { width: 100%; padding: 14px 14px 14px 44px; font-size: 16px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; border: 1.5px solid var(--eg-border); border-radius: var(--radius); background: var(--eg-white); color: var(--eg-text); outline: none; transition: border-color .2s, box-shadow .2s; }
  #egnw-input:focus { border-color: var(--eg-green); box-shadow: 0 0 0 3px rgba(0,101,58,.12); }
  #egnw-input::placeholder { color: #9aaba4; }
  #egnw-suggestions { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--eg-white); border: 1.5px solid var(--eg-border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 100; overflow: hidden; display: none; max-height: 300px; overflow-y: auto; }
  .egnw-suggestion { padding: 11px 16px; font-size: 14px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .12s; }
  .egnw-suggestion:hover, .egnw-suggestion.active { background: var(--eg-green-light); }
  .sug-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sug-dot.accepted { background: var(--eg-green); }
  .sug-dot.rejected { background: var(--eg-red); }
  .sug-category { font-size: 11px; color: var(--eg-muted); margin-left: auto; }
  #egnw-result { display: none; margin-top: 20px; animation: egFadeUp .25s ease; }
  @keyframes egFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .egnw-result-card { border-radius: var(--radius); overflow: hidden; border: 1.5px solid var(--eg-border); box-shadow: var(--shadow); }
  .egnw-result-card.accepted .result-header { background: var(--eg-green); }
  .egnw-result-card.rejected .result-header { background: var(--eg-red); }
  .result-header { padding: 18px 20px; }
  .result-header-inner { padding-left: 14px; border-left: 3px solid rgba(255,255,255,.35); }
  .result-status { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: white; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .result-status svg { width: 24px; height: 24px; flex-shrink: 0; }
  .result-item-name { font-size: 13px; color: rgba(255,255,255,.80); margin-top: 3px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; padding-left: 34px; }
  .result-body { background: var(--eg-white); padding: 20px; }
  .result-section { margin-bottom: 18px; }
  .result-section:last-child { margin-bottom: 0; }
  .result-section-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--eg-muted); margin-bottom: 6px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .result-section-text { font-size: 14px; color: var(--eg-text); line-height: 1.6; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .car-donation-notice { background: #eaf4e8; border: 1px solid #aed6ae; border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
  .car-donation-notice p { font-size: 14px; color: #1a4d1a; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; line-height: 1.6; margin: 0 0 10px; }
  .car-donation-notice p:last-child { margin: 0; }
  .car-donation-notice strong { font-weight: 600; }
  .car-donate-btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; background: var(--eg-green); color: white; border-radius: var(--radius); text-decoration: none; font-size: 14px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; font-weight: 600; transition: background .15s; }
  .car-donate-btn:hover { background: var(--eg-green-dark); }
  .car-donate-btn svg { width: 15px; height: 15px; stroke: white; fill: none; flex-shrink: 0; }
  .car-phone { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--eg-green-dark); font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; font-weight: 600; text-decoration: none; }
  .car-phone:hover { text-decoration: underline; }
  .electronics-notice svg { flex-shrink: 0; width: 18px; height: 18px; stroke: var(--eg-blue); fill: none; margin-top: 1px; }
  .electronics-notice p { font-size: 13px; color: #174a80; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; line-height: 1.5; margin: 0; }
  .electronics-notice strong { font-weight: 600; }
  .county-picker-wrap { background: var(--eg-green-light); border: 1px solid var(--eg-green-mid); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
  .county-picker-label { font-size: 13px; font-weight: 600; color: var(--eg-green-dark); margin-bottom: 8px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .county-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .county-btn { padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--eg-green); background: white; color: var(--eg-green); font-size: 13px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; cursor: pointer; transition: all .15s; font-weight: 500; }
  .county-btn:hover, .county-btn.selected { background: var(--eg-green); color: white; }
  .disposal-links { display: flex; flex-direction: column; gap: 8px; }
  .disposal-link { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--eg-bg); border: 1px solid var(--eg-border); border-radius: 8px; text-decoration: none; transition: border-color .15s, background .15s; }
  .disposal-link:hover { border-color: var(--eg-green); background: var(--eg-green-light); }
  .disposal-link-icon { flex-shrink: 0; width: 20px; height: 20px; background: var(--eg-green); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .disposal-link-icon svg { width: 12px; height: 12px; stroke: white; fill: none; }
  .disposal-link-text { flex: 1; }
  .disposal-link-name { font-size: 13px; font-weight: 600; color: var(--eg-green-dark); font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .disposal-link-desc { font-size: 12px; color: var(--eg-muted); font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; margin-top: 1px; }
  .egnw-hint { text-align: center; padding: 28px 0 8px; color: var(--eg-muted); font-size: 14px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; }
  .egnw-hint svg { width: 36px; height: 36px; stroke: var(--eg-green-mid); fill: none; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }
  .egnw-footer { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--eg-border); font-size: 12px; color: var(--eg-muted); font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; text-align: center; line-height: 1.5; }
  .egnw-footer a { color: var(--eg-green); text-decoration: none; }
  .egnw-footer a:hover { text-decoration: underline; }
  .condition-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', 'Libre Franklin', Arial Narrow, Arial, sans-serif; font-weight: 500; }
  .chip.ok { background: var(--eg-green-light); color: var(--eg-green-dark); }
  .chip.no { background: var(--eg-red-light); color: var(--eg-red); }
</style>
</head>
<body>
<div id="egnw-checker">
  <div class="egnw-header">
    <div class="egnw-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 9c0-1.657 1.343-3 3-3s3 1.343 3 3c0 1.5-1.5 2.5-3 3"/>
        <circle cx="12" cy="18" r="1" fill="white" stroke="none"/>
      </svg>
    </div>
    <div>
      <div class="egnw-title">Can I Donate This?</div>
      <div class="egnw-subtitle">Search any item to see if Evergreen Goodwill can accept it — and where to take it if not.</div>
    </div>
  </div>

  <div class="egnw-search-wrap">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="egnw-input" placeholder="e.g. blender, jeans, lamp, batteries, paint…" autocomplete="off" aria-label="Search for a donation item" aria-controls="egnw-suggestions" aria-expanded="false">
    <div id="egnw-suggestions" role="listbox" aria-label="Suggested items"></div>
  </div>

  <div id="egnw-hint" class="egnw-hint">
    <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Type an item above to check donation eligibility.
  </div>

  <div id="egnw-result" role="region" aria-live="polite" aria-label="Donation result"></div>

  <div class="egnw-footer">
    Guidelines subject to change.<br>Donation attendants will assess condition and have the authority to deny or accept any item.
  </div>
</div>

<script>
(function() {

// ── ITEM DATABASE ────────────────────────────────────────────────────────────
// status: "accepted" | "rejected"
// category: display label for suggestion list
// electronics: true = show data-wipe / e-cycle notice
// conditions: [{ok, text}]
// notes: main description
// disposal: key into DISPOSAL map (rejected items only)

const ITEMS = [

  // ── CLOTHING & ACCESSORIES ──────────────────────────────────────────────
  { name:"Clothing", category:"Clothing & Accessories",
    keywords:["cloth","shirt","pants","jeans","jacket","coat","dress","skirt","sweater","socks","underwear","bra","bras","sports bra","bralette","underwire bra","lingerie","panties","boxers","briefs","thong","shapewear","camisole","tank top","shoes","boots","hat","scarf","gloves","blouse","hoodie","shorts","leggings","suit","tie","blazer","vest","cardigan","turtleneck","polo","sportswear","activewear","pajamas","nightgown","robe","swimsuit","bikini","trunks","uniform","scrubs","overalls","romper","jumpsuit","onesie","warmup"],
    status:"accepted", notes:"Good news — your wardrobe cleanout is our treasure! Clean, wearable clothing in good condition is always welcome.",
    conditions:[{ok:true,text:"Clean & wearable"},{ok:false,text:"Wet, moldy, or heavily soiled"}] },

  { name:"Shoes & Footwear", category:"Clothing & Accessories",
    keywords:["shoes","boots","sneakers","sandals","heels","flats","loafers","oxfords","clogs","slippers","flip flops","moccasins","wedges","pumps","stilettos","ankle boots","knee boots","rain boots","galoshes","cleats","athletic shoes","running shoes","dress shoes","work boots","steel toe"],
    status:"accepted", notes:"Got shoes that still have miles left in them? Bring 'em in! Pairs in wearable condition are always accepted.",
    conditions:[{ok:true,text:"Both shoes present & wearable"},{ok:false,text:"Heavily worn, falling apart, or mismatched"}] },

  { name:"Handbags & Purses", category:"Clothing & Accessories",
    keywords:["handbag","purse","tote","clutch","backpack","wallet","bag","satchel","crossbody","messenger bag","duffel bag","fanny pack","wristlet","laptop bag"],
    status:"accepted", notes:"Out with the old, in with someone else's new favorite bag! Handbags, purses, backpacks, and bags in good condition are happily accepted." },

  { name:"Belts & Ties", category:"Clothing & Accessories",
    keywords:["belt","tie","necktie","bow tie","suspenders","lanyard"],
    status:"accepted", notes:"Belts, ties, and accessories in good condition are accepted — even that tie your uncle gave you that you've never worn." },

  { name:"Jewelry & Watches", category:"Clothing & Accessories",
    keywords:["jewelry","jewellery","necklace","bracelet","earrings","ring","watch","brooch","pendant","chain","anklet","cufflinks"],
    status:"accepted", notes:"Bling, baubles, and beyond — costume jewelry and watches in any condition are accepted. Fine jewelry is welcome too. Someone out there is going to feel very fancy." },

  { name:"Coins & Currency", category:"Collectibles",
    keywords:["coin","coins","loose change","change","pennies","quarters","dimes","nickels","pocket change","spare change","collectible coin","rare coin","commemorative coin","silver coin","gold coin","coin collection","coin set","proof coin","mint coin","foreign coin","foreign currency","currency","dollar coin","half dollar","morgan dollar","silver dollar","wheat penny","buffalo nickel","coin roll","piggy bank","currency collection","numismatic","paper money","banknote","bill","old money"],
    status:"accepted",
    notes:"We love coins — every single one! Loose change and spare coins are donated directly to support Evergreen Goodwill's tuition-free education programs for the community, so even that rogue penny at the bottom of your bag makes a difference. Collectible, rare, or commemorative coins are evaluated and sold, with proceeds supporting our mission. It all adds up to something meaningful." },



  { name:"Hats & Scarves", category:"Clothing & Accessories",
    keywords:["hat","scarf","cap","beanie","beret","fedora","baseball cap","winter hat","sun hat","fascinator","headband","hair accessories","gloves","mittens"],
    status:"accepted", notes:"Hats, scarves, gloves, and accessories in good condition are accepted. One person's forgotten beanie is another person's favorite winter staple." },

  { name:"Sunglasses & Eyewear", category:"Clothing & Accessories",
    keywords:["sunglasses","sunnies","shades","reading glasses","eyeglasses","glasses","spectacles","eyewear","prescription glasses","frames","optical frames","safety glasses","goggles","ski goggles","swim goggles","aviators","wayfarers","designer sunglasses"],
    status:"accepted",
    notes:"Sunglasses and eyewear in good condition are accepted — scratched lenses and all. Designer shades, readers, frames, and goggles are all welcome. Someone's whole look is about to come together.",
    conditions:[
      {ok:true, text:"Any style or brand in wearable condition"},
      {ok:false,text:"Severely scratched or broken frames"}
    ] },

  { name:"Wet or Soiled Clothing", category:"Clothing & Accessories",
    keywords:["wet clothing","soiled clothing","moldy clothes","dirty clothes","stained clothes"],
    status:"rejected", notes:"We love a second chance story, but even we have limits. Clothing that is wet, heavily soiled, or moldy isn't something we can accept — our staff will thank you for leaving those ones out.",
    disposal:"textile" },

  // ── FURNITURE ──────────────────────────────────────────────────────────
  { name:"Large Furniture", category:"Furniture",
    keywords:["large furniture","oversized furniture","big furniture","sectional sofa","large sectional","large couch","large sofa","large table","dining room set","bedroom set","furniture set","large cabinet","armoire","china hutch","large bookcase","large wardrobe","wall unit","entertainment wall","large dresser","triple dresser","large chest","king bed frame","california king","large desk","antique furniture","solid wood furniture","heavy furniture"],
    status:"rejected",
    notes:"As a general rule, if it's larger than a standard dresser or a sofa, we likely won't be able to accept it. Our stores have limited floor space and our team has limited lifting capacity — we mean that in the nicest possible way. When in doubt, call ahead or ask a donation attendant before unloading. Your county transfer station, Buy Nothing group, or Facebook Marketplace may be a great fit for larger pieces.",
    disposal:"bulk_item" },

  { name:"Sofas & Couches", category:"Furniture",
    keywords:["sofa","couch","loveseat","settee","futon couch","chaise","daybed"],
    status:"accepted", notes:"A good sofa can change someone's whole living room situation — standard-sized sofas and loveseats in clean, good condition are accepted. As a general size guide, if it's larger than a standard sofa we likely won't be able to take it. Stain-free, tear-free, and smell-free, please. We're picky on behalf of future shoppers.",
    conditions:[{ok:true,text:"Standard size, clean, dry & undamaged"},{ok:false,text:"Oversized or sectional sofas"},{ok:false,text:"Stained, torn, wet, or odorous"},{ok:false,text:"Sofa beds / hide-a-beds"}] },

  { name:"Sectional Sofa", category:"Furniture",
    keywords:["sectional","sectional sofa","l shaped sofa","u shaped sofa","modular sofa","large sectional","sectional couch"],
    status:"rejected",
    notes:"Sectional sofas are too large for us to accept — they're a logistics puzzle we don't have the floor space to solve. Your county transfer station or a furniture resale shop might be a better fit.",
    disposal:"bulk_item" },

  { name:"Sofa Bed / Hide-a-Bed", category:"Furniture",
    keywords:["sofa bed","hide-a-bed","sleeper sofa","pull out sofa","fold out sofa"],
    status:"rejected", notes:"As cool as the concept is, hide-a-bed sofas are one magic trick we can't accept. The mechanical complexity and resale challenges make them a no-go for us.",
    disposal:"bulk_item" },

  { name:"Tables", category:"Furniture",
    keywords:["table","dining table","coffee table","end table","side table","console table","kitchen table","folding table","accent table","sofa table","writing table"],
    status:"accepted", notes:"A good table brings people together — and we'd love to help yours find a new family. Standard-sized tables in good, sturdy condition are accepted. If it seats more than six or needs a truck to move, it's probably too large for us.",
    conditions:[{ok:true,text:"Standard size, sturdy & complete"},{ok:false,text:"Very large dining tables or sets"},{ok:false,text:"Broken, wobbly, or missing major parts"}] },

  { name:"Chairs", category:"Furniture",
    keywords:["chair","dining chair","armchair","accent chair","recliner","rocking chair","office chair","folding chair","bar stool","stool","ottoman","bean bag","gaming chair"],
    status:"accepted", notes:"Pull up a chair — actually, pull up several. Clean seating in good condition is always accepted and always in demand.",
    conditions:[{ok:true,text:"Clean & structurally sound"},{ok:false,text:"Torn upholstery, broken frame"}] },

  { name:"Bookshelves & Shelving", category:"Furniture",
    keywords:["bookshelf","bookcase","shelving","shelf","wall shelf","floating shelf","cube shelf","etagere"],
    status:"accepted", notes:"Bookshelves and shelving units in good condition are accepted. Empty or full of memories — either way, we'll take them." },

  { name:"Dressers & Chests", category:"Furniture",
    keywords:["dresser","chest of drawers","bureau","nightstand","night table","bedside table","armoire","wardrobe","chiffonier"],
    status:"accepted", notes:"Dressers and chests of drawers in good condition are accepted — a standard dresser is about our upper size limit for furniture, so keep that in mind for anything larger. Pro tip: all drawers should be present and actually work — we've seen things.",
    conditions:[{ok:true,text:"Standard size, all drawers present & functional"},{ok:false,text:"Oversized armoires or triple dressers"}] },

  { name:"Desks (Standard)", category:"Furniture",
    keywords:["desk","computer desk","student desk","writing desk","secretary desk","small desk"],
    status:"accepted", notes:"Standard desks in good condition are accepted — homework not included. Just note that very large or extremely heavy desks may not make the cut.",
    conditions:[{ok:true,text:"Standard size, good condition"},{ok:false,text:"Very large or extremely heavy desks"}] },

  { name:"Large Heavy Desk", category:"Furniture",
    keywords:["large desk","heavy desk","executive desk","old heavy desk","massive desk"],
    status:"rejected", notes:"We respect the commitment it took to own this desk, but very large or extremely heavy desks are not accepted. It's not you, it's the logistics.",
    disposal:"bulk_item" },

  { name:"Cabinets & Storage", category:"Furniture",
    keywords:["cabinet","storage cabinet","media cabinet","tv cabinet","curio cabinet","china cabinet","display cabinet","buffet","sideboard","credenza","hutch","linen cabinet"],
    status:"accepted", notes:"Smaller cabinets and storage furniture in good condition are accepted — the more organized, the better. Larger pieces like full china hutches, oversized armoires, or wall units are generally too large for our stores. When in doubt, call ahead.",
    conditions:[{ok:true,text:"Smaller cabinets in good condition"},{ok:false,text:"Oversized hutches or wall units"},{ok:false,text:"Metal file cabinets (not accepted)"}] },

  { name:"Metal File Cabinet", category:"Furniture",
    keywords:["file cabinet","filing cabinet","metal filing cabinet","lateral file"],
    status:"rejected", notes:"Metal file cabinets are a hard pass for us. The good news: scrap metal recyclers will actually be excited to see it.",
    disposal:"scrap_metal" },

  { name:"Mirrors", category:"Furniture",
    keywords:["mirror","wall mirror","floor mirror","vanity mirror","decorative mirror","full length mirror"],
    status:"accepted", notes:"Seven years of bad luck? Not here. Mirrors in good condition without chips or cracks are accepted — intact reflections only." },

  { name:"Lamps & Lighting", category:"Furniture",
    keywords:["lamp","table lamp","floor lamp","desk lamp","bedside lamp","chandelier","pendant light","sconce","light fixture","torchiere","arc lamp","banker lamp"],
    status:"accepted", notes:"Let someone else's home shine a little brighter. Lamps and light fixtures in working condition are accepted — bulbs not required, just the magic.",
    conditions:[{ok:true,text:"Working & complete (bulb not required)"},{ok:false,text:"Broken socket or frayed cord"}] },

  { name:"Damaged or Wet Furniture", category:"Furniture",
    keywords:["damaged furniture","broken furniture","stained furniture","wet furniture","torn furniture","moldy furniture"],
    status:"rejected", notes:"We believe in second chances, but some furniture has had its third, fourth, and fifth. Wet, stained, torn, structurally damaged, or completely disassembled pieces can't make the cut — sorry.",

const COUNTIES = ["King","Kitsap","Skagit","Snohomish","Whatcom"];
let selectedCounty = null;
let currentItem = null;

const input  = document.getElementById('egnw-input');
const sugBox = document.getElementById('egnw-suggestions');
const result = document.getElementById('egnw-result');
const hint   = document.getElementById('egnw-hint');

function search(q) {
  q = q.toLowerCase().trim();
  if (!q) return [];
  const scored = [];
  for (const item of ITEMS) {
    const nameLower = item.name.toLowerCase();
    let score = 0;
    if (nameLower === q) score = 100;
    else if (nameLower.startsWith(q)) score = 80;
    else if (nameLower.includes(q)) score = 60;
    else {
      for (const k of item.keywords) {
        if (k === q)            { score = Math.max(score, 70); break; }
        if (k.startsWith(q))   { score = Math.max(score, 50); }
        else if (k.includes(q)){ score = Math.max(score, 30); }
        else if (q.includes(k) && k.length >= 4){ score = Math.max(score, 20); }
      }
    }
    if (score > 0) scored.push({ item, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 8).map(s => s.item);
}

input.addEventListener('input', function() {
  const q = this.value;
  if (!q.trim()) { hideSuggestions(); showHint(); hideResult(); return; }
  const matches = search(q);
  matches.length ? showSuggestions(matches) : hideSuggestions();
});

input.addEventListener('keydown', function(e) {
  const items = sugBox.querySelectorAll('.egnw-suggestion');
  const active = sugBox.querySelector('.egnw-suggestion.active');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = active ? active.nextElementSibling : items[0];
    if (next) { active && active.classList.remove('active'); next.classList.add('active'); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = active ? active.previousElementSibling : items[items.length-1];
    if (prev) { active && active.classList.remove('active'); prev.classList.add('active'); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const a = sugBox.querySelector('.egnw-suggestion.active') || items[0];
    if (a) a.click();
  } else if (e.key === 'Escape') { hideSuggestions(); }
});

document.addEventListener('click', function(e) {
  if (!document.getElementById('egnw-checker').contains(e.target)) hideSuggestions();
});

function showSuggestions(matches) {
  sugBox.innerHTML = '';
  matches.forEach(item => {
    const div = document.createElement('div');
    div.className = 'egnw-suggestion';
    div.setAttribute('role','option');
    div.innerHTML = `<span class="sug-dot ${item.status}"></span><span style="flex:1">${item.name}</span><span class="sug-category">${item.category}</span>`;
    div.addEventListener('click', () => selectItem(item));
    sugBox.appendChild(div);
  });
  sugBox.style.display = 'block';
  input.setAttribute('aria-expanded','true');
}

function hideSuggestions() { sugBox.style.display='none'; input.setAttribute('aria-expanded','false'); }
function showHint() { hint.style.display='block'; }
function hideHint() { hint.style.display='none'; }
function hideResult() { result.style.display='none'; result.innerHTML=''; }

function selectItem(item) {
  currentItem = item;
  input.value = item.name;
  hideSuggestions(); hideHint(); renderResult(item);
}

function renderResult(item) {
  const ok = item.status === 'accepted';
  let condHTML = '';

    condHTML = `<div class="result-section">

  let carHTML = '';

    carHTML = `<div class="car-donation-notice">

      <br><a class="car-phone" href="tel:+18663984483">Or call (866) 398-4483 — ask for your donation to go to Evergreen Goodwill</a>
    </div>`;
  }
  if (item.electronics) {
    elecHTML = `<div class="electronics-notice">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <p><strong>Electronics policy:</strong> All donated electronics are thoroughly evaluated. Any existing data on relevant devices is erased using <strong>certified technologies</strong>. Items that cannot be sold are recycled responsibly through <strong>E-Cycle Washington</strong>, ensuring toxic materials stay out of our landfills.</p>
    </div>`;
  }
  let disposalHTML = '';
  if (!ok && item.disposal) {
    disposalHTML = !selectedCounty
      ? `<div class="county-picker-wrap">
           <div class="county-picker-label">📍 Select your county to see disposal options:</div>
           <div class="county-buttons">${COUNTIES.map(c=>`<button class="county-btn" onclick="window._egnwSetCounty('${c}')">${c}</button>`).join('')}</div>
         </div>`
      : renderDisposal(item.disposal, selectedCounty);
  }
  result.style.display = 'block';
  result.innerHTML = `
    <div class="egnw-result-card ${item.status}">
      <div class="result-header">
        <div class="result-header-inner">
          <div class="result-status">
            ${ok
              ? `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Yes, we accept this!`
              : `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> We cannot accept this`}
          </div>
          <div class="result-item-name">${item.name} &nbsp;·&nbsp; ${item.category}</div>
        </div>
      </div>
      <div class="result-body">
        ${carHTML}
        ${elecHTML}
        <div class="result-section">
          <div class="result-section-label">Details</div>
          <div class="result-section-text">${item.notes}</div>
        </div>
        ${condHTML}
        ${disposalHTML}
      </div>
    </div>`;
}

function renderDisposal(key, county) {
  const cat = DISPOSAL[key]; if (!cat) return '';
  const links = cat.counties[county] || []; if (!links.length) return '';
  const btns = COUNTIES.map(c=>`<button class="county-btn${c===county?' selected':''}" onclick="window._egnwSetCounty('${c}')">${c}</button>`).join('');
  return `
    <div class="county-picker-wrap">
      <div class="county-picker-label">📍 Showing disposal options for ${county} County:</div>
      <div class="county-buttons">${btns}</div>
    </div>
    <div class="result-section">
      <div class="result-section-label">${cat.label} — where to take it</div>
      <div class="disposal-links">${links.map(l=>`
        <a class="disposal-link" href="${l.url}" target="_blank" rel="noopener">
          <div class="disposal-link-icon"><svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></div>
          <div class="disposal-link-text">
            <div class="disposal-link-name">${l.name}</div>
            <div class="disposal-link-desc">${l.desc}</div>
          </div>
        </a>`).join('')}
      </div>
    </div>`;
}

window._egnwSetCounty = function(county) {
  selectedCounty = county;
  if (currentItem) renderResult(currentItem);
};
